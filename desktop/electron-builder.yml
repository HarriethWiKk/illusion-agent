# electron-builder 配置
# ======================
# 三端打包配置。便携版策略：
#   - Windows: dir target（产出文件夹，CI 后续打 zip），解压即用、启动快
#   - macOS:   dmg target（未签名，用户需绕过 Gatekeeper，见 docs/zh-CN/desktop.md）
#   - Linux:   AppImage（单文件便携）
#
# 内置 Python / Node 通过 extraResources 放到 Resources/ 下（asar 外，可 spawn）。

appId: com.illusionagent.desktop
productName: IllusionAgent
# executableName 显式指定，避免从 package.json name(@illusion/desktop) 派生出含 @ 的可执行名（AppImage 不接受）
executableName: IllusionAgent
# 不设 artifactName：用 electron-builder 默认命名，避免 macOS dmg 构建时内部中间产物路径不匹配（ENOENT）
# upload 步骤用 *.zip/*.dmg/*.AppImage 通配符，不依赖具体产物名

# publish 配置：仅用于计算 channel name 生成 latest-*.yml（auto-update 元数据）。
# 实际上传由 --publish never 禁用，改由单独的 action-gh-release 步骤上传产物。
# 不加此配置时，dmg/AppImage 生成 update info 会因 publish 为 null 报
# 'Cannot read properties of null (reading channel')。
publish:
  provider: github
  owner: YunTaiHua
  repo: illusion-agent
directories:
  output: release
  buildResources: build

# 打进 asar 的文件（主进程编译产物）
files:
  - dist/**/*
  - package.json

asar: true

# 内置运行时复制到 Resources/（asar 外，运行时 process.resourcesPath 访问）
extraResources:
  - from: resources/
    to: .

win:
  target: dir
  icon: build/icon.ico

mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target: AppImage
  icon: build/icon.png
  category: Development
