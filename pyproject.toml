[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "illusion-code"
version = "0.1.2"
description = "Open-source Python port of Claude Code - an AI-powered CLI coding assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "YunTaiHua", email = "3597489498@qq.com" },
]
keywords = ["ai", "cli", "coding-agent", "claude-code", "llm", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
illusion = "illusion.cli:app"

[project.urls]
Homepage = "https://github.com/YunTaiHua/illusion-code"
Repository = "https://github.com/YunTaiHua/illusion-code"
Issues = "https://github.com/YunTaiHua/illusion-code/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/illusion"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "illusion/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "illusion/_frontend/tsconfig.json"
"frontend/terminal/src" = "illusion/_frontend/src"
"frontend/terminal/dist" = "illusion/_frontend/dist"
"frontend/web/dist" = "illusion/_web_dist"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
