name: Debug daemon ipc

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -e ".[dev,all]" pytest-timeout

      - name: Ping stability test
        run: |
          python - <<'EOF'
          import asyncio, os, tempfile, uuid
          from pathlib import Path
          from illusion.daemon_ipc import DaemonClient, DaemonServer, DaemonType

          async def main():
              sock = str(Path(tempfile.mkdtemp()) / f"t_{uuid.uuid4().hex[:8]}.sock")
              server = DaemonServer(daemon_type=DaemonType.CRON, daemon_pid=os.getpid(), pipe_name=sock)
              await server.start()
              client = DaemonClient(daemon_type=DaemonType.CRON, pid=os.getpid(), pipe_name=sock)
              assert await client.connect()
              ok = 0
              for i in range(20):
                  resp = await client.ping(timeout=2.0)
                  if resp and resp.get("type") == "pong":
                      ok += 1
                  else:
                      print(f"  ping[{i}] FAILED: {resp}", flush=True)
                  await asyncio.sleep(1.0)
              print(f"ping 成功率: {ok}/20", flush=True)
              await client.close()
              await server.stop()
              print("server stopped OK", flush=True)
              assert ok == 20, "ping 存在失败！"

          asyncio.run(main())
          print("PASS")
          EOF

      - name: Run daemon_ipc tests
        run: |
          python -m pytest tests/test_utils/test_daemon_ipc.py -q --timeout=60
