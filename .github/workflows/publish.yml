name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest pytest-timeout ruff
          pip install -e ".[dev,all]"

      - name: Lint
        run: ruff check src/

      - name: Test
        timeout-minutes: 20
        run: |
          pytest tests/ -q --timeout=30 \
            --ignore tests/test_utils/test_daemon_ipc.py \
            --deselect "tests/test_tasks/test_manager.py::test_create_agent_task_with_command_override_and_write" \
            --deselect "tests/test_tasks/test_manager.py::test_write_to_stopped_agent_task_restarts_process" \
            --deselect "tests/test_tools/test_shell_common.py::TestCommandExecutor::test_run_and_normalize_timeout" \
            --deselect "tests/test_tools/test_shell_common.py::TestRunAndNormalizeCancel::test_cancelled_error_kills_process"

      - name: Build
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
