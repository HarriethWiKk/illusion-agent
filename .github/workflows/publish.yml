name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest ruff
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/

      - name: Test
        run: |
          pytest tests/ -q \
            --deselect tests/test_mcp/test_stdio_flow.py::test_stdio_mcp_manager_connects_and_executes_real_server \
            --deselect tests/test_plugins/test_lifecycle_flow.py::test_plugin_install_load_and_uninstall_flow \
            --deselect tests/test_skills/test_loader.py::test_load_skill_registry_includes_bundled \
            --deselect tests/test_tools/test_core_tools.py::test_glob_and_grep \
            --deselect tests/test_tools/test_integration_flows.py::test_search_edit_flow_across_registry

      - name: Build
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
